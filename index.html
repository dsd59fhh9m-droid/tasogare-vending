<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2c2540" />
  <title>黄昏自販機</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="scene" aria-label="黄昏の田舎道に置かれた古い自販機">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="mountains mountains-back"></div>
    <div class="mountains mountains-front"></div>
    <div class="utility-pole"></div>
    <div class="wire wire-a"></div>
    <div class="wire wire-b"></div>
    <div class="grass grass-left"></div>
    <div class="grass grass-right"></div>
    <div class="road"></div>

    <section class="hud" aria-live="polite">
      <div>
        <span class="hud-label">所持金</span>
        <strong id="wallet">¥500</strong>
      </div>
      <div>
        <span class="hud-label">買った本数</span>
        <strong id="count">0</strong>
      </div>
    </section>

    <section class="machine-wrap">
      <div class="machine" id="machine">
        <div class="machine-rust rust-1"></div>
        <div class="machine-rust rust-2"></div>
        <div class="machine-rust rust-3"></div>
        <div class="brand">黄昏自販機</div>

        <div class="display-window">
          <div class="products" id="products"></div>
        </div>

        <div class="control-panel">
          <div class="coin-slot"></div>
          <div class="price-screen" id="status">商品を選んでください</div>
          <button class="return-button" id="resetBtn" type="button">最初から</button>
        </div>

        <div class="pickup-label">取り出し口</div>
        <button class="pickup" id="pickup" type="button" aria-label="取り出し口">
          <span id="pickupText">EMPTY</span>
        </button>
      </div>
    </section>

    <section class="message-panel" aria-live="polite">
      <p id="message">夕暮れの帰り道。錆びた自販機だけが、まだ明かりを灯している。</p>
    </section>

    <div class="toast" id="toast" role="status"></div>
  </main>

  <script src="game.js"></script>
</body>
</html>
